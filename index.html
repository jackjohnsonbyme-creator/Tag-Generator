<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free SEO Tag & Hashtag Generator for YouTube & TikTok</title>
  <meta name="description" content="Generate high-ranking viral tags and hashtags for your YouTube videos and TikToks instantly for free. Boost your reach with our smart SEO tool.">
  <meta name="keywords" content="youtube tag generator, tiktok hashtag generator, seo tags tool, viral tags, youtube seo">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/tags.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-top: 20px;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    button.btn-generate {
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-generate:hover {
      background: #1d4ed8;
    }
    .output-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      min-height: 120px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
      margin-bottom: 15px;
    }
    .tag {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    button.btn-copy {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-copy:hover {
      background: #059669;
    }
    .tools-grid {
      margin-top: 30px;
      width: 100%;
      max-width: 600px;
    }
    .tools-grid h3 {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .tool-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #cbd5e1;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SEO Tag & Hashtag Generator</h1>
    <p class="subtitle">Generate high-ranking tags for YouTube and TikTok</p>
    
    <div class="input-group">
      <input type="text" id="keyword" placeholder="Enter topic or keyword...">
      <button class="btn-generate" onclick="generateTags()">Generate</button>
    </div>

    <div class="output-box" id="tagsBox">
      <span style="color: #64748b; font-size: 0.85rem;">Generated tags will appear here...</span>
    </div>

    <button class="btn-copy" onclick="copyTags()">Copy All Tags</button>
  </div>

  <div class="tools-grid">
    <h3>MORE FREE TOOLS</h3>
    <div class="grid">
  <a onclick="openTool('password')" class="tool-card" style="cursor:pointer;">Password Generator</a>
  <a onclick="openTool('text')" class="tool-card" style="cursor:pointer;">Text Counter</a>
  <a onclick="openTool('qr')" class="tool-card" style="cursor:pointer;">QR Code Maker</a>
  <a onclick="openTool('prompt')" class="tool-card" style="cursor:pointer;">AI Prompt Helper</a>
    </div>
  </div>

  <script>
    function generateTags() {
      const input = document.getElementById('keyword').value.trim();
      const tagsBox = document.getElementById('tagsBox');
      
      if (!input) {
        alert('Please enter a keyword!');
        return;
      }

      const suffixes = ['', ' 2026', ' tutorial', ' review', ' viral', ' shorts', ' tiktok', ' top', ' guide', ' new'];
      let tagsHTML = `<span class="tag">#${input.replace(/\s+/g, '')}</span>`;
      
      suffixes.forEach(suf => {
        const cleanTag = (input + suf).replace(/\s+/g, '');
        tagsHTML += `<span class="tag">#${cleanTag}</span>`;
      });
      
      tagsHTML += `<span class="tag">#shorts</span><span class="tag">#${input.split(' ')[0]}</span>`;
      tagsBox.innerHTML = tagsHTML;
    }

    function copyTags() {
      const tagsBox = document.getElementById('tagsBox');
      const tags = Array.from(tagsBox.querySelectorAll('.tag')).map(t => t.innerText).join(' ');
      
      if (!tags) {
        alert('No tags to copy!');
        return;
      }

      navigator.clipboard.writeText(tags).then(() => {
        alert('Tags copied to clipboard!');
      });
    }
  </script>
  <!-- Modal oyna tuzilmasi -->
<div id="toolModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:#1e293b; padding:24px; border-radius:12px; width:90%; max-width:450px; position:relative; color:#fff;">
    <span onclick="closeModal()" style="position:absolute; top:12px; right:16px; cursor:pointer; font-size:24px;">&times;</span>
    <h3 id="modalTitle" style="margin-top:0; color:#38bdf8;">Tool</h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  function openTool(toolType) {
  const modal = document.getElementById('toolModal');
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('modalBody');
  modal.style.display = 'flex';

  if (toolType === 'password') {
    title.innerText = 'Password Generator';
    body.innerHTML = `
      <p style="font-size:14px; color:#94a3b8;">Generate a strong password:</p>
      <input type="text" id="passResult" readonly style="width:100%; padding:10px; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:6px; margin-bottom:12px;">
      <button onclick="generatePassword()" style="width:100%; padding:10px; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer;">Generate Password</button>
    `;
    generatePassword();
  } else if (toolType === 'text') {
    title.innerText = 'Text Counter';
    body.innerHTML = `
      <textarea id="textInput" oninput="countText()" placeholder="Enter your text here..." style="width:100%; height:100px; padding:10px; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:6px; margin-bottom:12px; resize:none;"></textarea>
      <div style="font-size:14px; color:#cbd5e1;">
        Characters: <b id="charCount" style="color:#38bdf8;">0</b> | Words: <b id="wordCount" style="color:#38bdf8;">0</b>
      </div>
    `;
  } else if (toolType === 'qr') {
    title.innerText = 'QR Code Maker';
    body.innerHTML = `
      <input type="text" id="qrInput" placeholder="Enter URL or text..." style="width:100%; padding:10px; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:6px; margin-bottom:12px;">
      <button onclick="makeQR()" style="width:100%; padding:10px; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer; margin-bottom:12px;">Generate QR Code</button>
      <div id="qrResult" style="text-align:center;"></div>
    `;
  } else if (toolType === 'prompt') {
    title.innerText = 'AI Prompt Helper';
    body.innerHTML = `
      <p style="font-size:14px; color:#94a3b8;">What topic do you need a prompt for?</p>
      <input type="text" id="promptTopic" placeholder="e.g. YouTube video idea" style="width:100%; padding:10px; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:6px; margin-bottom:12px;">
      <button onclick="generatePrompt()" style="width:100%; padding:10px; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer; margin-bottom:12px;">Generate Prompt</button>
      <textarea id="promptResult" readonly style="width:100%; height:100px; padding:10px; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:6px; resize:none;"></textarea>
    `;
  }
}

function closeModal() {
  document.getElementById('toolModal').style.display = 'none';
}

function generatePassword() {
  const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";
  let pass = "";
  for (let i = 0; i < 14; i++) {
    pass += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  document.getElementById('passResult').value = pass;
}

function countText() {
  const txt = document.getElementById('textInput').value;
  document.getElementById('charCount').innerText = txt.length;
  document.getElementById('wordCount').innerText = txt.trim() === "" ? 0 : txt.trim().split(/\s+/).length;
}

function makeQR() {
  const val = document.getElementById('qrInput').value;
  const res = document.getElementById('qrResult');
  if(val.trim() !== "") {
    res.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(val)}" alt="QR Code" style="margin-top:10px; border-radius:8px;">`;
  }
}

function generatePrompt() {
  const topic = document.getElementById('promptTopic').value.trim();
  const res = document.getElementById('promptResult');

  if(topic !== "") {
    const templates = [
      `Act as an expert content creator. Create a detailed, engaging, and highly viral outline about "${topic}". Include key hooks, main points, and a strong call-to-action.`,
      `You are a top YouTube strategist. Write 5 high-CTR titles, an engaging opening hook, and a short script draft for a video about "${topic}".`,
      `Act as a social media copywriter. Generate a persuasive caption with high-ranking hashtags and strong engagement questions focused on "${topic}".`,
      `Act as an SEO content marketer. Generate a bulleted list of content ideas, target audience insights, and keyword opportunities for "${topic}".`
    ];

    const randomPrompt = templates[Math.floor(Math.random() * templates.length)];
    res.value = randomPrompt;
  } else {
    res.value = "Please enter a topic first!";
  }
}
</script>
</body>
</html>
