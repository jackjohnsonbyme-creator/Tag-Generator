<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube & TikTok SEO Tag Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-top: 20px;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    button.btn-generate {
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-generate:hover {
      background: #1d4ed8;
    }
    .output-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      min-height: 120px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
      margin-bottom: 15px;
    }
    .tag {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    button.btn-copy {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-copy:hover {
      background: #059669;
    }
    .tools-grid {
      margin-top: 30px;
      width: 100%;
      max-width: 600px;
    }
    .tools-grid h3 {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .tool-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #cbd5e1;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SEO Tag & Hashtag Generator</h1>
    <p class="subtitle">Generate high-ranking tags for YouTube and TikTok</p>
    
    <div class="input-group">
      <input type="text" id="keyword" placeholder="Enter topic or keyword...">
      <button class="btn-generate" onclick="generateTags()">Generate</button>
    </div>

    <div class="output-box" id="tagsBox">
      <span style="color: #64748b; font-size: 0.85rem;">Generated tags will appear here...</span>
    </div>

    <button class="btn-copy" onclick="copyTags()">Copy All Tags</button>
  </div>

  <div class="tools-grid">
    <h3>MORE FREE TOOLS</h3>
    <div class="grid">
      <a href="#" class="tool-card">Password Generator</a>
      <a href="#" class="tool-card">Text Counter</a>
      <a href="#" class="tool-card">QR Code Maker</a>
      <a href="#" class="tool-card">AI Prompt Helper</a>
    </div>
  </div>

  <script>
    function generateTags() {
      const input = document.getElementById('keyword').value.trim();
      const tagsBox = document.getElementById('tagsBox');
      
      if (!input) {
        alert('Please enter a keyword!');
        return;
      }

      const suffixes = ['', ' 2026', ' tutorial', ' review', ' viral', ' shorts', ' tiktok', ' top', ' guide', ' new'];
      let tagsHTML = `<span class="tag">#${input.replace(/\s+/g, '')}</span>`;
      
      suffixes.forEach(suf => {
        const cleanTag = (input + suf).replace(/\s+/g, '');
        tagsHTML += `<span class="tag">#${cleanTag}</span>`;
      });
      
      tagsHTML += `<span class="tag">#shorts</span><span class="tag">#${input.split(' ')[0]}</span>`;
      tagsBox.innerHTML = tagsHTML;
    }

    function copyTags() {
      const tagsBox = document.getElementById('tagsBox');
      const tags = Array.from(tagsBox.querySelectorAll('.tag')).map(t => t.innerText).join(' ');
      
      if (!tags) {
        alert('No tags to copy!');
        return;
      }

      navigator.clipboard.writeText(tags).then(() => {
        alert('Tags copied to clipboard!');
      });
    }
  </script>
</body>
</html>
